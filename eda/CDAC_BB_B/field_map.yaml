dataset_key: CDAC_BB_B
source_file: "CDAC_BB_DATASET - Sheet1.csv"
n_rows: 5889
n_cols: 10
read_kwargs:
  encoding: utf-8          # no BOM; ASCII + a few U+FFFD replacement chars
  sep: ","
  dtype: str               # REQUIRED: stops pandas coercing Phone/coords
  keep_default_na: false   # REQUIRED: the literal string "NA" is a real Address value (965 rows)
  na_values: [""]

# NOTE: this dataset is a near-twin of CDAC_BB_A. See eda/CDAC_BB_A/RECONCILIATION.md.
# Rows 0-5678 are the same records in the same order as CDAC_BB_A rows 0-5678;
# rows 5679-5888 are a verbatim re-append of this file's own rows 5469-5678.
# It contributes ZERO facilities that CDAC_BB_A does not already contain.

source_column_map:
  State:
    canonical: state_raw
    confidence: low
    transform: "strip, upper, spell_correct, normalize_lgd"
    flags: [misspelled, mislabelled_rows]
    notes: "36 distinct values. FIVE are misspelled and will not join to any LGD table:
            'Andra Pradesh' (326 rows), 'Gujrat' (382), 'Chattisgarh' (181),
            'Jammu and Kasmir' (66), 'Lakshwadeep' (1). Worse: Sikkim is absent — its 5 rows
            (indices 3716-3720, all with 'Sikkim' in the Address) are labelled 'Rajasthan'.
            CDAC_BB_A has all 37 states spelled correctly; prefer A's State column."

  Name:
    canonical: facility_name_raw
    confidence: high
    transform: "strip, collapse_whitespace"
    notes: "5539 distinct over 5889 rows (350 duplicate-name rows, 210 of which are the
            re-appended block). Casing is CLEANER than CDAC_BB_A's: only 4 rows contain an
            ALL-CAPS state token vs 73 in A. Encodes an un-keyed facility-type vocabulary:
            BSU=1449, CHC=434, SDH=126, BSC=107, RH=98, SGH=13, AIIMS=14, DHH=9, IRCS=7."

  Address:
    canonical: address_raw
    confidence: high
    transform: "strip; split on final ', Dist. <X>' to derive district; strip leading 'NA,'/'-,'"
    notes: "100% of rows end in ', Dist. <district>' and a district is parseable for
            5888/5889 rows — this is how you recover the District column that CDAC_BB_A has
            and this file lacks. 965 rows are effectively empty ('NA, <place>, Dist. <X>').
            Only 114 rows (1.9%) contain a 6-digit pincode. 52 rows contain U+FFFD mojibake."

  Latitude:
    canonical: latitude
    confidence: medium
    transform: "to_float; reject rows outside lat 6-38 / lon 68-98"
    flags: [has_nulls, has_out_of_bbox]
    notes: "PRIMARY point geo but weaker than CDAC_BB_A's: 5859/5889 (99.49%) inside India's
            bbox, 25 null, 5 outside (e.g. row 482 = 38.96375/35.24332, Turkey; row 4651 =
            1.662981/103.5999, Singapore). CDAC_BB_A has a valid coordinate for every one of
            those 30 rows. Median distance to its own district centroid 6.5 km vs 6.3 km for A."

  Longitude:
    canonical: longitude
    confidence: medium
    transform: "to_float"
    notes: "See Latitude."

  Phone:
    canonical: phone
    confidence: low
    transform: "split on ','; strip non-digits; drop tokens that are '0'/'#'/scientific notation"
    flags: [pii, excel_corrupted]
    notes: "ONLY 925/5889 rows (15.7%) carry a recoverable number. 3783 rows (64.2%) were
            destroyed by Excel scientific notation ('9.12E+09'); 1043 are the literal
            '0'/'0.00E+00'; 172 are '########' and 3 are '#ERROR!'; 476 are null.
            Byte-identical to CDAC_BB_A's Phone on all 5679 shared rows."

  Email:
    canonical: email
    confidence: medium
    transform: "strip, lower, validate_rfc_lite"
    flags: [pii]
    notes: "4188/5889 non-null (71.1%). 28 structurally invalid. Casing is cleaner than
            CDAC_BB_A's (A has 22 rows with an uppercased state token spliced into the
            local part). 243 addresses are shared by more than one row, so email is not a key."

  Category:
    canonical: facility_ownership_raw
    confidence: high
    transform: "map to controlled list"
    flags: [coded_vocabulary]
    notes: "Complete vocabulary, 4 values: Govt.=2787, Private=1691, Charitable/Vol=1308,
            Red Cross=103. No nulls. Byte-identical to CDAC_BB_A on all 5679 shared rows."

  new_longitude:
    canonical: null
    disposition: drop
    reason: "prior geocoding pass, worse than Latitude/Longitude and internally inconsistent:
             valid as labelled for rows 0-5468; for rows 5469-5888 the column holds a
             LATITUDE (426 rows); 344 rows (5.8%) are outside India in BOTH orientations
             (e.g. row 9 = -157.862/21.30623, Honolulu; row 114 = -44.2575/-2.55289, Brazil)."
    flags: [derived, redundant_with:Longitude, axis_swapped_in_block]

  new_latitude:
    canonical: null
    disposition: drop
    reason: "see new_longitude — same failed geocoding pass, same swap block, same 344 bad rows."
    flags: [derived, redundant_with:Latitude, axis_swapped_in_block]

proposed_new_fields:
  - name: facility_subtype_raw
    reason: "1449 rows (24.6%) are Blood Storage Units, flagged only by a 'BSU' token inside
             Name. A BSU is a storage annexe of a licensed blood centre, not an independent
             blood bank; without a separable field, facility counts by state are ~33% inflated."
  - name: geo_source
    reason: "Latitude/Longitude and new_latitude/new_longitude are two independent geocodes.
             Even after dropping new_*, the surviving coordinate's provenance should be recorded."

unmapped_columns: []

drop_columns: [new_longitude, new_latitude]

missing_relative_to_CDAC_BB_A:
  - District      # recoverable: parse trailing 'Dist. <X>' from Address (5888/5889 rows)
  - dist_name     # NOT recoverable — the legacy/LGD district alias exists only in CDAC_BB_A

record_provenance:
  source_snapshot_date: "unknown — not in the data. File mtime 2025-11-23, but content is
                         identical to the 2025-06 CDAC_BB_A file plus a duplicated block, so
                         the mtime reflects a re-export, not a newer scrape. Do not treat this
                         file as a later snapshot."
  source_sheet_name: "Sheet1 (from the filename — this was exported from a Google Sheet)"
  record_status: null

candidate_primary_key:
  column: null
  is_unique: false
  note: "No column and no tried composite is unique. (Name, Address) has 213 duplicate rows;
         (Name, Address, Latitude, Longitude) still has 3. Synthesise a surrogate key."

entity_resolution:
  blocking_key: "normalize(State) + normalize(district-parsed-from-Address) + first-3-tokens(Name)"
  supports_name_geo_district: true
  usable_rows_pct: 99.58     # 25 rows have no coordinate at all
  weak_fields: [State, Phone, Email, new_longitude, new_latitude]
  warning: "Loading this file alongside CDAC_BB_A will double-count 5676 facilities and
            quadruple-count 210 of them. Load exactly one. See eda/CDAC_BB_A/RECONCILIATION.md."
