# ---------------------------------------------------------------------------
entity_resolution:
  source_primary_key: "NIN:<SrNo>"
  blocking_key: "(normalized facility_name, district_raw, state_raw) with geo as a confirmer"
  blocking_key_viable: true
  coverage:
    name: 100.00
    district_real: 99.94
    geo_in_india_bbox: 97.86
    pincode: 90.07
    name_and_district_and_geo: 97.80
  unmatchable_row_pct: 0.06     # 6 rows lacking a usable name or district
  caveats:
    - "43.24% of facility names contain no facility-type keyword (bare place names) — name-only matching will over-merge."
    - "1293 rows sit on a coordinate shared with a DIFFERENT facility (one coordinate carries 57 distinct Salem hospitals) — geo alone must not confirm a match below ~1 km."
    - "114 rows with in-bbox geo sit >500 km from their own declared state's median centroid; 59 of Rewari district's 89 rows are outside Rewari."
