# Harmonization contract for DATASET_KEY = NIN
# Source: 22_MAY_22_AP_NIN.csv
# All statistics quoted here are from eda/NIN/profile.json (generated by eda/NIN/scripts/07_build_profile.py).
#
# Read the file with EXACTLY these kwargs — see `read` below. Column 1's header is an empty
# string preceded by a UTF-8 BOM; pandas renames it to "Unnamed: 0". Reference it positionally
# (df.columns[0]) or rename immediately.

dataset_key: NIN

read:
  path: 22_MAY_22_AP_NIN.csv
  function: pandas.read_csv
  kwargs:
    encoding: utf-8-sig
    dtype: str
    keep_default_na: false
    na_values: [""]
  post_read_required:
    - rename_column: {position: 0, from: "Unnamed: 0", to: "_stale_pandas_index"}
    - drop_rows: "all 24 data columns null  ->  removes 203 rows (200 trailing + 3 interior)"
    - "expect 10327 logical rows x 25 columns after the drop"
  do_not:
    - "index_col=0  (column 1 is a stale pandas index with 106 gaps, not a key)"
    - "default na handling (turns the literal strings 'NA'/'null' into NaN and drops leading zeros)"

# ---------------------------------------------------------------------------
source_column_map:

  # --- structural / junk ----------------------------------------------------
  "":                              # header is literally empty (BOM-only); pandas -> "Unnamed: 0"
    canonical: null
    disposition: drop
    confidence: high
    reason: >
      Stale pandas RangeIndex from an earlier df.to_csv(). Strictly increasing 0..10635, unique,
      but with 106 gaps (rows deleted after that export). Carries no facility information.
      Optionally retain as `source_row_order` for provenance/auditing only.

  "Unnamed: 23":
    canonical: null
    disposition: drop
    confidence: high
    reason: "0 non-null values in all 10530 parsed rows. Trailing-comma export artifact."

  "Non filled numbering":
    canonical: null
    disposition: drop
    confidence: high
    reason: >
      Prior-pipeline artifact. Unique monotonic 3..731 on exactly the 623 rows that also carry a
      Manual Health Facility Name — a manual-curation work-queue counter, not a facility attribute.
      If curation lineage matters, keep as `curation_seq` (proposed field) rather than mapping it.

  # --- identity -------------------------------------------------------------
  "SrNo":
    canonical: source_facility_id
    confidence: high
    transform: "cast int; emit as 'NIN:' || SrNo"
    notes: >
      Unique and 100% populated across all 10327 logical rows. Integer range 1..192898 — this file
      is a ~5.4% extract of a larger parent register that shares the numbering. Two Notes values
      reference other rows by SrNo ("Duplicate or SR No. 85112"), confirming SrNo is the register's
      own identifier. This is the source primary key.

  "Health Facility Name":
    canonical: facility_name_raw
    confidence: high
    transform: "strip; collapse internal whitespace (10 values have leading/trailing space)"
    notes: >
      100% filled, 10000 distinct of 10327. Caution: 43.24% of values carry NO facility-type
      keyword and are bare place names ('Chunawadh', 'KODAVASAL'); the type is in `Facility Type`.

  "Manual Health Facility Name":
    canonical: facility_name_alt
    confidence: high
    transform: "strip (217 of 623 values have trailing whitespace)"
    notes: >
      Human-curated name on 6.03% of rows. Disagrees with the auto name on 56.82% of the 623 rows
      where both exist — it is a rewrite into house style ('Piler Community Health Center' ->
      'CHC Piler'). AUTHORITATIVE where present; use COALESCE(manual, auto) for the display name
      and keep the auto value as facility_name_raw for audit.

  # --- address --------------------------------------------------------------
  "Address":
    canonical: address_raw
    confidence: medium
    transform: "strip; NULL out sentinels ('\\N' x188, '0' x124, '-' x96, 'na' x1)"
    notes: >
      79.83% raw fill, but median length is 12 chars — an address FRAGMENT (often just a town or
      the facility type restated), not a postal address. Do not treat as a geocodable string.

  "Manual_Address":
    canonical: address_alt
    confidence: high
    transform: "strip (170 of 530 values have trailing whitespace); strip trailing literal '\\n'"
    notes: >
      5.13% fill. Google-Maps-style formatted addresses ending in the state name, median 32 chars.
      Where both are filled (125 rows) they agree 0% of the time and `Address` is usually a
      sentinel or one word. AUTHORITATIVE where present.

  "street":
    canonical: street
    confidence: high
    transform: "strip; NULL out sentinels ('\\N' x229, '-' x12, '0' x7, 'na' x1)"

  "landmark":
    canonical: landmark
    confidence: high
    transform: "strip; NULL out sentinels ('\\N' x23, '-' x6, '0' x2, 'na' x1)"

  "locality":
    canonical: locality
    confidence: medium
    transform: "strip; NULL out sentinels ('\\N' x23, '0' x8, '-' x2, 'na' x1)"
    notes: >
      Mixed grain — neighbourhood names, city names, and the literal words 'Urban' (43) / 'Rural'
      (32) which are a settlement CLASS, not a locality. Split those out before use.

  "pincode":
    canonical: pincode
    confidence: high
    transform: "keep as 6-char string (never cast to int — that destroys nothing here today but is fragile)"
    notes: >
      90.07% filled and every one of the 9302 non-null values is exactly 6 digits with a valid
      Indian leading digit 1-8. Cleanest column in the file. Two values are implausible round
      numbers (500000, 110000) that are not real delivery pincodes.

  "Manual_Pincode":
    canonical: pincode_alt
    confidence: medium
    transform: >
      strip; reject the 6 non-6-digit values ('#REF!', 'Karnataka', 'Assam',
      'Karnataka 585331', 'Karnataka 587201', 'Rajasthan 326035' — for the last three,
      extract the trailing 6 digits)
    notes: >
      5.08% fill; 519/525 clean. Disagrees with `pincode` on 50 of the 161 rows where both exist
      (31.06%). On those 50, the manual value is confirmed by the text of Manual_Address in 9
      cases and the auto value in 0 cases — so the manual value wins on the evidence available,
      but confidence is only medium because 41 of 50 disagreements are unadjudicated.

  # --- admin geo ------------------------------------------------------------
  "State_Name":
    canonical: state_raw
    confidence: high
    transform: "strip; upper; map 'Telengana' -> 'TELANGANA'; normalize_lgd"
    notes: >
      100% filled, 34 distinct, otherwise clean and consistently cased. Only defect is the
      misspelling 'Telengana' (173 rows). Coverage is wildly uneven: Tamil Nadu 2736 vs Kerala 1.
      Uses pre-2019 J&K ('Jammu & Kashmir', no Ladakh) and pre-2020 'Dadra & Nagar Haveli' /
      'Daman & Diu' as separate UTs — a dating signal, see PROFILE.md.

  "District_Name":
    canonical: district_raw
    confidence: medium
    transform: >
      strip; strip trailing '\\' and embedded CR/LF (38 rows, 'Almora\\\n');
      NULL out '\\N' (6 rows); strip trailing ' District' suffix (468 rows, 34 distinct values,
      all AP/Telangana); upper-case before matching (one case collision: 'Balrampur' UP vs
      'BALRAMPUR' Chhattisgarh — these are TWO REAL DIFFERENT DISTRICTS, do not merge)
    notes: "623 raw distinct; 620 after suffix normalization. 99.94% real fill."

  "Taluka_Name":
    canonical: subdistrict_raw
    confidence: medium
    transform: "strip; NULL out '\\N' (859 rows); strip embedded CR/LF (1 row)"
    notes: "Raw fill 100% but real fill only 91.68%. 3427 real distinct values."

  "Block_Name":
    canonical: block_raw
    confidence: low
    transform: "strip; NULL out '\\N' (2460 rows)"
    notes: >
      Raw fill 100% but real fill only 76.18% — the single most sentinel-polluted column.
      Frequently holds an urban body ('COIMBATORE CORPN', 'CHENNAI ZONE X') rather than a rural
      block, so it is not a consistent LGD block. Low confidence for joining.

  # --- point geo ------------------------------------------------------------
  "latitude":
    canonical: latitude
    confidence: high
    transform: "to_float; NULL out exact 0 (68 rows); reject outside lat 6..38"
  "longitude":
    canonical: longitude
    confidence: high
    transform: "to_float; NULL out exact 0 (69 rows); reject outside lon 68..98"
    notes: >
      97.86% of rows land inside the India bbox. 42 rows are lat/lon SWAPPED (detectable: lat in
      68..98 and lon in 6..38) and are recoverable by swapping. 85 are out-of-bbox junk
      (min lon -115.20, max lon 118.66). See issues.md.
  "altitude":
    canonical: altitude
    confidence: low
    transform: "to_float; NULL out 0 (6423 rows) and '\\N' (23 rows) — 0 means NOT CAPTURED, not sea level"
    notes: >
      REAL values, not junk, but only 37.6% of rows carry one. Non-zero range 0.26–5985 m,
      median 175 m, and state medians are geographically correct (J&K 1589 m, Uttarakhand 1320 m,
      Meghalaya 1019 m, Delhi ~0). Fill is batch-dependent (Tamil Nadu 97.9% non-zero, Delhi 0.16%,
      Chandigarh/Goa/Tripura/Puducherry/Mizoram/Nagaland 0%), which makes altitude!=0 a usable
      PROXY for 'this row's geo came from the elevation-enriched capture batch'. A few values are
      wrong (three Auraiya, UP facilities carry 2700 m against a true ~130 m).

  # --- classify -------------------------------------------------------------
  "Facility Type":
    canonical: facility_type_raw
    confidence: high
    transform: "strip; map to canonical taxonomy via codebook (13 closed values, listed below)"
    notes: >
      100% filled. NOT a clean taxonomy — it mixes function (Community Health Center,
      Dispensaries, Post Partum Unit) with bed-size bands (<100 / 100-500 / >500 Bedded Hospital)
      on one axis. 'Others' is 2382 rows (23.07%) and is mostly private hospitals/nursing homes,
      so it doubles as an implicit facility_ownership_raw signal. Split into
      facility_type_raw + bed_count_band on ingest.

  # --- contact --------------------------------------------------------------
  "landline_number":
    canonical: phone
    confidence: medium
    flags: [pii]
    transform: >
      strip; NULL out sentinels ('0' x34, '-' x27, '\\N' x23); split on ','/'/' (141 rows hold
      multiple numbers); move the 2 email addresses to `email`; strip non-digits
    notes: >
      60.00% fill. 832 values (13.4%) are 10-digit numbers beginning 6-9, i.e. personal MOBILE
      numbers — PII. Digit-length runs 0..19. Do not expose in a public view without review.

  # --- provenance / curation ------------------------------------------------
  "Notes":
    canonical: null
    disposition: keep_as_proposed_field
    proposed_canonical: curation_note
    confidence: medium
    transform: "strip (9 values untrimmed)"
    notes: >
      1.51% fill, 66 distinct values, free text but SEMI-STRUCTURED and worth partial extraction:
        - 81 rows  'NF' / 'not found' / 'NF, <detail>'      -> record_status = 'not_located'
        - 26 rows  'Listed as <type>' / 'Labelled as <type> on map' -> facility_type_alt
        - 14 rows  'name as per google-<name>'              -> geo_source/name provenance = google_maps
        -  9 rows  'geo cordinates for X used for Y'        -> geo_accuracy = 'borrowed_from_other_facility'
        -  2 rows  'Duplicate or SR No. 85112' / 'Same as row 702' -> explicit duplicate pointers
      Extract those five patterns; leave the ~24 one-off remarks as raw text.

  "Manually_added":
    canonical: null
    disposition: keep_as_proposed_field
    proposed_canonical: is_manually_curated
    confidence: high
    transform: "lower; strip; map {'yes','y'} -> true; NULL -> false"
    notes: >
      5.09% fill. Boolean-with-nulls: 5 raw case/whitespace variants all meaning yes
      ('Yes' 481, 'yes' 25, 'yes ' 12, 'Yes ' 5, 'Y' 3). There is NO 'No' value — blank means
      not manually added. Note `Coder` is a broader flag: 73 rows have a Coder but a blank
      Manually_added.

  "Coder":
    canonical: null
    disposition: keep_internal_only
    proposed_canonical: curated_by
    confidence: high
    flags: [pii]
    transform: "lower; strip; hash or map to an opaque coder_id before any public exposure"
    notes: >
      5.81% fill. 9 raw variants collapsing to 5 people: tanmay 358, shalmali 175, mallika 57,
      sweta 6, sid 4. First names of identifiable internal staff => low-sensitivity PII. Keep in
      the internal provenance table for quality attribution; exclude from the LLM-queryable view.

# ---------------------------------------------------------------------------
proposed_new_fields:
  - name: address_alt
    reason: >
      The vocabulary has facility_name_alt but no address equivalent. NIN carries a second,
      human-verified address column (Manual_Address, 530 rows) that agrees with address_raw 0% of
      the time. Forcing both into address_raw would destroy the auto-vs-verified distinction that
      makes this dataset's geocoding auditable.
  - name: pincode_alt
    reason: >
      Same argument for Manual_Pincode (525 rows, disagrees with pincode on 31% of the overlap).
      A single pincode field cannot represent 'the automated value says 847105 and the coder says
      847203'.
  - name: curation_note
    reason: >
      `Notes` is coder commentary about the RECORD, not about the facility. record_status is too
      narrow (it only captures the 81 'not found' rows) and provenance has no free-text slot.
  - name: curated_by
    reason: "Who edited the row. Provenance has source_sheet_name but no actor. PII-bearing."
  - name: is_manually_curated
    reason: >
      Boolean 'a human researched this row'. record_status is a status enum, not a curation flag;
      overloading it would conflate 'not_located' (from Notes) with 'manually_added'.
  - name: curation_seq
    reason: >
      Optional. Preserves 'Non filled numbering' (1..731) so the manual-curation batch can be
      reconstructed in order. Drop if lineage is not needed.
  - name: bed_count_band
    reason: >
      `Facility Type` collapses two orthogonal axes. Three of its 13 values are bed-size bands
      ('<100 Bedded Hospital' 183, '100-500 Bedded Hospital' 64, '>500 Bedded Hospital' 14),
      which belong under capacity, not classification. The vocabulary has bed_count (a number)
      but no band.
  - name: geo_capture_batch
    reason: >
      Optional derived flag. altitude != 0 partitions the file into two capture batches with very
      different geo characteristics (see PROFILE.md). Recording it makes the geo-quality variance
      explainable downstream instead of looking like random noise.

# ---------------------------------------------------------------------------
unmapped_columns:
  - ""                        # BOM-only header, stale pandas index -> drop
  - "Unnamed: 23"             # entirely empty -> drop
  - "Non filled numbering"    # curation work-queue counter -> drop or curation_seq

